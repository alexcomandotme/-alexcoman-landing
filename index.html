<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>alexcoman.me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: transparent;
    font-family: 'JetBrains Mono', monospace;
    padding: 1rem;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    transition: opacity 0.4s ease;
  }
  body.fade-out { opacity: 0; }
  .term-header {
    font-size: 10px;
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 1rem;
    font-weight: 700;
  }
  .term-output {
    font-size: 11px;
    color: rgba(255,255,255,0.6);
    line-height: 1.6;
    font-weight: 700;
    position: relative;
    overflow-y: auto;
    max-height: 60vh;
  }
  .term-output .line { display: block; white-space: pre-wrap; word-break: break-word; }
  .term-output .dim { color: rgba(255,255,255,0.3); }
  .term-output .bright { color: #fff; }
  .term-output .ok { color: #1D9E75; }
  .term-output .err { color: #E24B4A; }
  .term-output .ai { color: #5DCAA5; }
  .term-input-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 1rem;
    border-top: 0.5px solid rgba(255,255,255,0.12);
    padding-top: 1rem;
  }
  .term-prompt {
    font-size: 10px;
    color: rgba(255,255,255,0.3);
    white-space: nowrap;
    font-weight: 700;
  }
  #term-input {
    background: transparent;
    border: none;
    outline: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px; /* must be 16px+ to prevent iOS auto-zoom */
    font-weight: 700;
    color: #fff;
    flex: 1;
    caret-color: #fff;
    transform: scale(0.6875); /* 11/16 = visually 11px */
    transform-origin: left center;
  }
  #term-input::placeholder {
    color: rgba(255,255,255,0.5);
    font-weight: 700;
  }
  .ai-link {
    color: #5DCAA5;
    cursor: pointer;
    display: block;
    text-decoration: none;
  }
  .ai-link:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="term-header">alexcoman.me</div>

<div class="term-output" id="output">
  <span class="line">operations, systems. you're at the surface.</span>
  <span class="line dim">there's more underneath.</span>
  <span class="line">&nbsp;</span>
  <span class="line">&gt; what are you looking for?</span>
</div>

<div class="term-input-row">
  <span class="term-prompt">alex@coman ~ %</span>
  <input id="term-input" autocomplete="off" autocorrect="off" spellcheck="false" autofocus placeholder="type a command..." />
</div>

<script>
const config = {
  redirectCommands: ['open desktop', 'cd desktop', 'cd /desktop', 'desktop'],
  desktopUrl: 'https://alexcoman.me/desktop',
  apiUrl: 'https://alexcoman-landing.vercel.app/api/ask',
  birthDate: '1990-08-19T09:30:00Z',
  email: 'hi@alexcoman.me',
  contactKeywords: ['contact', 'email', 'reach', 'mail', 'get in touch', 'hire', 'work with'],
  funfacts: [
    "LLMs don't actually think. they autocomplete at scale.",
    "AI's every response is a statistical guess."
  ]
};

const input = document.getElementById('term-input');
const output = document.getElementById('output');

window.addEventListener('load', () => input.focus());
window.addEventListener('focus', () => input.focus());
document.addEventListener('click', () => input.focus());

const aiHistory = [];
const cmdHistory = [];
let cmdHistoryIdx = -1;
let uptimeInterval = null;
let linksShown = [];

function addLine(text, cls) {
  const span = document.createElement('span');
  span.className = 'line ' + (cls || '');
  span.textContent = text;
  output.appendChild(span);
  output.scrollTop = output.scrollHeight;
  return span;
}

function addLines(lines) {
  lines.forEach(l => addLine(l.text, l.cls || ''));
  addLine('');
}

function openInNewTab(url) {
  window.open(url, '_blank', 'noopener,noreferrer');
}

function fadeAndRedirect(url) {
  document.body.classList.add('fade-out');
  setTimeout(() => {
    try { window.top.location.href = url; }
    catch (e) { window.location.href = url; }
  }, 450);
}

function copyToClipboard(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise((resolve, reject) => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try {
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      ok ? resolve() : reject();
    } catch (e) {
      document.body.removeChild(ta);
      reject(e);
    }
  });
}

function addEmailBlock() {
  const emailLine = document.createElement('div');
  emailLine.className = 'line';
  emailLine.style.color = '#5DCAA5';
  emailLine.style.cursor = 'pointer';
  emailLine.style.userSelect = 'text';

  const [user, domain] = config.email.split('@');
  const prefix = document.createElement('span');
  prefix.textContent = '> ';
  const userSpan = document.createElement('span');
  userSpan.textContent = user + '\u200B';
  const at = document.createElement('span');
  at.textContent = '@';
  const domainSpan = document.createElement('span');
  domainSpan.textContent = domain;
  const status = document.createElement('span');
  status.textContent = '  [click to copy]';
  status.style.color = 'rgba(255,255,255,0.4)';

  emailLine.append(prefix, userSpan, at, domainSpan, status);
  emailLine.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    copyToClipboard(config.email).then(() => {
      status.textContent = '  [copied]';
      setTimeout(() => { status.textContent = '  [click to copy]'; }, 1500);
    }).catch(() => {
      status.textContent = '  [select & copy manually]';
    });
  });

  output.appendChild(emailLine);

  const gmailLink = document.createElement('a');
  gmailLink.href = 'https://mail.google.com/mail/?view=cm&fs=1&to=' + encodeURIComponent(config.email);
  gmailLink.target = '_blank';
  gmailLink.rel = 'noopener noreferrer';
  gmailLink.textContent = '> open in gmail';
  gmailLink.className = 'line';
  gmailLink.style.color = 'rgba(255,255,255,0.4)';
  output.appendChild(gmailLink);
  output.scrollTop = output.scrollHeight;
}

function clearUptime() {
  if (uptimeInterval) { clearInterval(uptimeInterval); uptimeInterval = null; }
}

function getUptime() {
  const born = new Date(config.birthDate);
  const diff = new Date() - born;
  const years = Math.floor(diff / (1000 * 60 * 60 * 24 * 365.25));
  const days = Math.floor((diff % (1000 * 60 * 60 * 24 * 365.25)) / (1000 * 60 * 60 * 24));
  const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
  const secs = Math.floor((diff % (1000 * 60)) / 1000);
  return `${years}y ${days}d ${hours}h ${mins}m ${secs}s`;
}

function showThinkingDots() {
  const span = document.createElement('span');
  span.className = 'line dim';
  span.textContent = '>';
  output.appendChild(span);
  output.scrollTop = output.scrollHeight;
  let dots = 0;
  const interval = setInterval(() => {
    dots = (dots + 1) % 4;
    span.textContent = '>' + '.'.repeat(dots);
  }, 300);
  return { element: span, stop: () => clearInterval(interval) };
}

const commands = {
  help: () => addLines([
    { text: 'available commands:', cls: 'dim' },
    { text: '  sayhello' },
    { text: '  whoami' },
    { text: '  readme' },
    { text: '  uptime' },
    { text: '  funfact' },
    { text: '  clear' }
  ]),
  readme: () => addLines([
    { text: 'this is the surface.' },
    { text: 'the work lives somewhere else.' },
    { text: 'https://linkedin.com/in/alexcoman', cls: 'ok' }
  ]),
  clear: () => { output.innerHTML = ''; addLine(''); },
  cls: () => commands.clear(),
  whoami: () => {
    addLine('redirecting to /desktop...', 'dim');
    setTimeout(() => fadeAndRedirect(config.desktopUrl), 600);
  },
  uptime: () => {
    clearUptime();
    const span = document.createElement('span');
    span.className = 'line bright';
    span.textContent = getUptime();
    output.appendChild(span);
    addLine('load average: variable', 'dim');
    addLine('');
    uptimeInterval = setInterval(() => { span.textContent = getUptime(); }, 1000);
  },
  funfact: () => {
    const pick = config.funfacts[Math.floor(Math.random() * config.funfacts.length)];
    addLine(pick);
    addLine('');
  },
  sayhello: () => {
    addLine('> hello!', 'ai');
    askAI('hello');
  }
};

function isContactIntent(query) {
  const q = query.toLowerCase();
  return config.contactKeywords.some(k => q.includes(k));
}

function handleContact() {
  addLine('> reach out:', 'ai');
  addEmailBlock();
  addLine('');
}

async function askAI(query) {
  const thinking = showThinkingDots();
  aiHistory.push({ role: 'user', content: query });

  try {
    const response = await fetch(config.apiUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        query,
        history: aiHistory.slice(-6),
        isMobile: window.innerWidth < 768,
        linksShown
      })
    });

    const data = await response.json();
    const text = data.text;

    thinking.stop();
    thinking.element.remove();

    if (text) {
      aiHistory.push({ role: 'assistant', content: text });
      if (aiHistory.length > 6) aiHistory.splice(0, 2);

      const lines = text.split('\n').filter(l => l.trim());

      lines.forEach(l => {
        const urlMatch = l.trim().match(/(?:https?:\/\/)?alexcoman\.me\/[a-z0-9\-]+/i)
          || l.trim().match(/^https?:\/\/\S+/);

        if (urlMatch) {
          const rawUrl = urlMatch[0];
          const fullUrl = rawUrl.startsWith('http') ? rawUrl : 'https://' + rawUrl;
          if (!linksShown.includes(fullUrl)) linksShown.push(fullUrl);

          const a = document.createElement('a');
          a.href = fullUrl;
          a.textContent = '> ' + rawUrl;
          a.className = 'line ai-link';
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.addEventListener('click', e => { e.preventDefault(); openInNewTab(fullUrl); });
          output.appendChild(a);
          output.scrollTop = output.scrollHeight;
          openInNewTab(fullUrl);

        } else if (l.trim().match(/^[\w.]+@[\w.]+\.\w+$/)) {
          const email = l.trim();
          const a = document.createElement('a');
          a.href = 'mailto:' + email;
          a.textContent = '> ' + l.trim();
          a.style.color = '#5DCAA5';
          a.style.display = 'block';
          a.className = 'line';
          a.target = '_top';
          output.appendChild(a);
          output.scrollTop = output.scrollHeight;
        } else {
          addLine('> ' + l, 'ai');
        }
      });
      addLine('');
    } else {
      addLine('> no response.', 'err');
      addLine('');
    }
  } catch (e) {
    thinking.stop();
    thinking.element.remove();
    addLine('> connection failed.', 'err');
    addLine('');
  }
}

input.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (cmdHistory.length === 0) return;
    if (cmdHistoryIdx === -1) cmdHistoryIdx = cmdHistory.length;
    cmdHistoryIdx = Math.max(0, cmdHistoryIdx - 1);
    input.value = cmdHistory[cmdHistoryIdx] || '';
    return;
  }
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (cmdHistory.length === 0 || cmdHistoryIdx === -1) return;
    cmdHistoryIdx++;
    if (cmdHistoryIdx >= cmdHistory.length) { cmdHistoryIdx = -1; input.value = ''; }
    else input.value = cmdHistory[cmdHistoryIdx];
    return;
  }

  if (e.key !== 'Enter') return;

  const val = input.value.trim();
  const valLower = val.toLowerCase();
  if (!val) return;

  cmdHistory.push(val);
  cmdHistoryIdx = -1;

  addLine('alex@coman ~ % ' + val, 'dim');
  input.value = '';

  if (valLower !== 'uptime') clearUptime();

  if (config.redirectCommands.indexOf(valLower) !== -1) {
    addLine('unlocking /desktop...', 'dim');
    addLine('redirecting.', 'ok');
    setTimeout(() => fadeAndRedirect(config.desktopUrl), 800);
    return;
  }

  if (commands[valLower]) { commands[valLower](); return; }
  if (isContactIntent(val)) { handleContact(); return; }

  askAI(val);
});
</script>
</body>
</html>
