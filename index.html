<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>alexcoman.me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { height: 100%; }
  body {
    background: transparent;
    font-family: 'JetBrains Mono', monospace;
    height: 100%;
    display: flex;
    flex-direction: column;
    transition: opacity 0.4s ease;
    overflow: hidden;
  }
  body.fade-out { opacity: 0; }

  .term-header {
    font-size: 10px;
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 700;
    padding: 1rem 1rem 0.75rem;
    flex-shrink: 0;
  }

  .term-output {
    font-size: 11px;
    color: rgba(255,255,255,0.6);
    line-height: 1.6;
    font-weight: 700;
    flex: 1;
    overflow-y: auto;
    padding: 0 1rem;
    -webkit-overflow-scrolling: touch;
  }
  .term-output .line { display: block; white-space: pre-wrap; word-break: break-word; }
  .term-output .dim { color: rgba(255,255,255,0.3); }
  .term-output .bright { color: #fff; }
  .term-output .ok { color: #1D9E75; }
  .term-output .err { color: #E24B4A; }
  .term-output .ai { color: #5DCAA5; }

  .term-input-row {
    display: flex;
    align-items: center;
    gap: 6px;
    border-top: 0.5px solid rgba(255,255,255,0.12);
    padding: 0.75rem 1rem;
    flex-shrink: 0;
    background: transparent;
  }
  .term-prompt {
    font-size: 10px;
    color: rgba(255,255,255,0.3);
    white-space: nowrap;
    font-weight: 700;
  }
  #term-input {
    background: transparent;
    border: none;
    outline: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    flex: 1;
    caret-color: #fff;
    -webkit-appearance: none;
    border-radius: 0;
  }
  #term-input::placeholder {
    color: rgba(255,255,255,0.4);
    font-weight: 700;
  }
  .ai-link {
    color: #5DCAA5;
    cursor: pointer;
    display: block;
    text-decoration: none;
  }
  .ai-link:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="term-header">alexcoman.me</div>

<div class="term-output" id="output">
  <span class="line">operations, systems. you're at the surface.</span>
  <span class="line dim">there's more underneath.</span>
  <span class="line">&nbsp;</span>
  <span class="line">&gt; what are you looking for?</span>
  <span class="line">&nbsp;</span>
</div>

<div class="term-input-row">
  <span class="term-prompt">alex@coman ~ %</span>
  <input id="term-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="type a command..." />
</div>

<script>
const config = {
  redirectCommands: ['open desktop', 'cd desktop', 'cd /desktop', 'desktop'],
  desktopUrl: 'https://alexcoman.me/desktop',
  apiUrl: 'https://alexcoman-landing.vercel.app/api/ask',
  email: 'hi@alexcoman.me',
  contactKeywords: ['contact', 'email', 'reach', 'mail', 'get in touch', 'hire', 'work with'],
};

const input = document.getElementById('term-input');
const output = document.getElementById('output');

// Handle iOS visual viewport resize (keyboard show/hide)
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => {
    document.body.style.height = window.visualViewport.height + 'px';
    output.scrollTop = output.scrollHeight;
  });
}

document.addEventListener('click', (e) => {
  if (e.target !== input) input.focus();
});

const aiHistory = [];
const cmdHistory = [];
let cmdHistoryIdx = -1;
let linksShown = [];

function addLine(text, cls) {
  const span = document.createElement('span');
  span.className = 'line ' + (cls || '');
  span.textContent = text;
  output.appendChild(span);
  output.scrollTop = output.scrollHeight;
  return span;
}

function addLines(lines) {
  lines.forEach(l => addLine(l.text, l.cls || ''));
  addLine('');
}

function openInNewTab(url) {
  window.open(url, '_blank', 'noopener,noreferrer');
}

function fadeAndRedirect(url) {
  document.body.classList.add('fade-out');
  setTimeout(() => {
    try { window.top.location.href = url; }
    catch (e) { window.location.href = url; }
  }, 450);
}

function copyToClipboard(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise((resolve, reject) => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try {
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      ok ? resolve() : reject();
    } catch (e) {
      document.body.removeChild(ta);
      reject(e);
    }
  });
}

function addEmailBlock() {
  const emailLine = document.createElement('div');
  emailLine.className = 'line';
  emailLine.style.color = '#5DCAA5';
  emailLine.style.cursor = 'pointer';

  const status = document.createElement('span');
  status.textContent = '  [tap to copy]';
  status.style.color = 'rgba(255,255,255,0.4)';

  emailLine.textContent = '> ' + config.email;
  emailLine.appendChild(status);

  emailLine.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    copyToClipboard(config.email).then(() => {
      status.textContent = '  [copied]';
      setTimeout(() => { status.textContent = '  [tap to copy]'; }, 1500);
    });
  });

  output.appendChild(emailLine);
  output.scrollTop = output.scrollHeight;
}

function showThinkingDots() {
  const span = document.createElement('span');
  span.className = 'line dim';
  span.textContent = '>';
  output.appendChild(span);
  output.scrollTop = output.scrollHeight;
  let dots = 0;
  const interval = setInterval(() => {
    dots = (dots + 1) % 4;
    span.textContent = '>' + '.'.repeat(dots);
  }, 300);
  return { element: span, stop: () => clearInterval(interval) };
}

const commands = {
  help: () => addLines([
    { text: 'available commands:', cls: 'dim' },
    { text: '  whoami  •  readme  •  clear  •  uptime' }
  ]),
  clear: () => { output.innerHTML = ''; addLine(''); },
  cls: () => commands.clear(),
  whoami: () => {
    addLine('redirecting...', 'dim');
    setTimeout(() => fadeAndRedirect(config.desktopUrl), 600);
  },
  readme: () => addLines([
    { text: 'this is the surface.' },
    { text: 'the work is on desktop.' }
  ]),
  uptime: () => {
    const born = new Date('1990-08-19T09:30:00Z');
    const diff = new Date() - born;
    const years = Math.floor(diff / (1000 * 60 * 60 * 24 * 365.25));
    const days = Math.floor((diff % (1000 * 60 * 60 * 24 * 365.25)) / (1000 * 60 * 60 * 24));
    addLine(years + 'y ' + days + 'd', 'bright');
    addLine('');
  }
};

function isContactIntent(query) {
  const q = query.toLowerCase();
  return config.contactKeywords.some(k => q.includes(k));
}

async function askAI(query) {
  const thinking = showThinkingDots();
  aiHistory.push({ role: 'user', content: query });

  try {
    const response = await fetch(config.apiUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        query,
        history: aiHistory.slice(-6),
        isMobile: true,
        linksShown
      })
    });

    const data = await response.json();
    const text = data.text;

    thinking.stop();
    thinking.element.remove();

    if (text) {
      aiHistory.push({ role: 'assistant', content: text });
      if (aiHistory.length > 6) aiHistory.splice(0, 2);

      const lines = text.split('\n').filter(l => l.trim());
      lines.forEach(l => {
        const urlMatch = l.trim().match(/(?:https?:\/\/)?alexcoman\.me\/[a-z0-9\-]+/i)
          || l.trim().match(/^https?:\/\/\S+/);

        if (urlMatch) {
          const rawUrl = urlMatch[0];
          const fullUrl = rawUrl.startsWith('http') ? rawUrl : 'https://' + rawUrl;
          if (!linksShown.includes(fullUrl)) linksShown.push(fullUrl);
          const a = document.createElement('a');
          a.href = fullUrl;
          a.textContent = '> ' + rawUrl;
          a.className = 'line ai-link';
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          output.appendChild(a);
          output.scrollTop = output.scrollHeight;
        } else if (l.trim().match(/^[\w.]+@[\w.]+\.\w+$/)) {
          addEmailBlock();
        } else {
          addLine('> ' + l, 'ai');
        }
      });
      addLine('');
    } else {
      addLine('> no response.', 'err');
      addLine('');
    }
  } catch (e) {
    thinking.stop();
    thinking.element.remove();
    addLine('> connection failed.', 'err');
    addLine('');
  }
}

input.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (!cmdHistory.length) return;
    if (cmdHistoryIdx === -1) cmdHistoryIdx = cmdHistory.length;
    cmdHistoryIdx = Math.max(0, cmdHistoryIdx - 1);
    input.value = cmdHistory[cmdHistoryIdx] || '';
    return;
  }
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (!cmdHistory.length || cmdHistoryIdx === -1) return;
    cmdHistoryIdx++;
    if (cmdHistoryIdx >= cmdHistory.length) { cmdHistoryIdx = -1; input.value = ''; }
    else input.value = cmdHistory[cmdHistoryIdx];
    return;
  }
  if (e.key !== 'Enter') return;

  const val = input.value.trim();
  const valLower = val.toLowerCase();
  if (!val) return;

  cmdHistory.push(val);
  cmdHistoryIdx = -1;
  addLine('alex@coman ~ % ' + val, 'dim');
  input.value = '';

  if (config.redirectCommands.includes(valLower)) {
    addLine('redirecting...', 'dim');
    setTimeout(() => fadeAndRedirect(config.desktopUrl), 800);
    return;
  }
  if (commands[valLower]) { commands[valLower](); return; }
  if (isContactIntent(val)) { addLine('> reach out:', 'ai'); addEmailBlock(); addLine(''); return; }
  askAI(val);
});
</script>
</body>
</html>
