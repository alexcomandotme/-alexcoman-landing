<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>alexcoman.me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: transparent; }

  #terminal {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    font-family: 'JetBrains Mono', monospace;
    padding: 1.5rem 1.25rem 0;
  }
  .term-header {
    font-size: 11px;
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 1.5rem;
    flex-shrink: 0;
  }
  #output {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    font-size: 14px;
    line-height: 1.9;
    font-weight: 400;
  }
  #output .line {
    display: block;
    white-space: pre-wrap;
    word-break: break-word;
    animation: fadein 0.4s ease both;
  }
  @keyframes fadein {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  #output .dim  { color: rgba(255,255,255,0.3); }
  #output .ai   { color: rgba(255,255,255,0.75); }
  #output .err  { color: #E24B4A; }
  #output .link { color: #5DCAA5; text-decoration: none; display: block; }

  .term-input-row {
    display: flex;
    align-items: center;
    gap: 8px;
    border-top: 0.5px solid rgba(255,255,255,0.12);
    padding: 1rem 0;
    flex-shrink: 0;
  }
  .term-prompt {
    font-size: 12px;
    color: rgba(255,255,255,0.3);
    white-space: nowrap;
    font-weight: 700;
  }
  #term-input {
    position: absolute;
    opacity: 0;
    width: 1px;
    height: 1px;
    border: none;
    outline: none;
    padding: 0;
    font-size: 16px; /* prevent iOS zoom */
    -webkit-appearance: none;
  }
  #term-input::placeholder { color: rgba(255,255,255,0.25); }

  /* blinking block cursor */
  #cursor {
    display: inline-block;
    width: 8px;
    height: 15px;
    background: rgba(255,255,255,0.65);
    vertical-align: middle;
    animation: blink 1s step-end infinite;
    flex-shrink: 0;
  }
  #cursor.hidden { display: none; }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0; }
  }

  /* typed text preview next to cursor */
  #typed-preview {
    font-size: 14px;
    font-weight: 400;
    color: rgba(255,255,255,0.75);
    font-family: 'JetBrains Mono', monospace;
    white-space: nowrap;
    overflow: hidden;
  }
</style>
</head>
<body>
<div id="terminal">
  <div class="term-header">alexcoman.me</div>
  <div id="output"></div>
  <div class="term-input-row">
    <span class="term-prompt">alex@coman ~ %</span>
    <span id="typed-preview"></span>
    <span id="cursor"></span>
    <input id="term-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
  </div>
</div>

<script>
const API_URL  = 'https://alexcoman-landing.vercel.app/api/ask';
const input    = document.getElementById('term-input');
const output   = document.getElementById('output');
const terminal = document.getElementById('terminal');
const cursor   = document.getElementById('cursor');
const preview  = document.getElementById('typed-preview');

// ── iOS visual viewport ──
if (window.visualViewport) {
  const vv = window.visualViewport;
  function onVV() {
    terminal.style.height = vv.height + 'px';
    terminal.style.top    = vv.offsetTop + 'px';
    output.scrollTop = output.scrollHeight;
  }
  vv.addEventListener('resize', onVV);
  vv.addEventListener('scroll', onVV);
}

// ── tap to focus ──
terminal.addEventListener('click', (e) => {
  if (e.target.tagName !== 'A') input.focus();
});

// ── hide/show fake cursor when real keyboard is active ──
input.addEventListener('focus', () => cursor.classList.add('hidden'));
input.addEventListener('blur',  () => { cursor.classList.remove('hidden'); preview.textContent = ''; });

// ── mirror typed text into preview span ──
input.addEventListener('input', () => { preview.textContent = input.value; });

// ── fade-in helper ──
function addLine(text, cls, delay) {
  const span = document.createElement('span');
  span.className = 'line' + (cls ? ' ' + cls : '');
  span.textContent = text;
  if (delay) span.style.animationDelay = delay + 'ms';
  output.appendChild(span);
  output.scrollTop = output.scrollHeight;
}

// ── render initial welcome with staggered fade ──
const welcome = [
  'hey — glad you stopped by.',
  'alex kept this minimal on mobile.',
  'the full experience is on desktop —',
  "that's where the work lives.",
];
welcome.forEach((line, i) => addLine(line, 'ai', i * 120));

const history = [];

function renderResponse(text) {
  const lines = text.split('\n');
  let delay = 0;
  lines.forEach(raw => {
    const l = raw.trimEnd();
    if (!l) { addLine('\u00a0', '', delay); delay += 60; return; }
    if (/^[\w.+-]+@[\w-]+\.\w+$/.test(l.trim())) {
      const a = document.createElement('a');
      a.href = 'mailto:' + l.trim();
      a.textContent = l.trim();
      a.className = 'line link';
      a.style.animationDelay = delay + 'ms';
      output.appendChild(a);
      output.scrollTop = output.scrollHeight;
    } else {
      addLine(l, 'ai', delay);
    }
    delay += 80;
  });
  addLine('\u00a0', '', delay);
}

function showThinking() {
  const span = document.createElement('span');
  span.className = 'line dim';
  span.textContent = '.';
  output.appendChild(span);
  output.scrollTop = output.scrollHeight;
  let d = 0;
  const t = setInterval(() => { d=(d+1)%4; span.textContent='.'.repeat(d+1); }, 350);
  return { el: span, stop: () => clearInterval(t) };
}

input.addEventListener('keydown', async (e) => {
  if (e.key !== 'Enter') return;
  const val = input.value.trim();
  if (!val) return;

  preview.textContent = '';
  addLine('> ' + val, 'dim');
  input.value = '';
  setTimeout(() => input.focus(), 50);

  if (val.toLowerCase() === 'clear') { output.innerHTML = ''; return; }

  const thinking = showThinking();
  history.push({ role: 'user', content: val });

  try {
    const res  = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: val, history: history.slice(-6) })
    });
    const data = await res.json();
    thinking.stop();
    thinking.el.remove();
    const text = data.text || '';
    history.push({ role: 'assistant', content: text });
    if (history.length > 12) history.splice(0, 2);
    renderResponse(text);
  } catch {
    thinking.stop();
    thinking.el.remove();
    addLine('connection failed.', 'err');
    addLine('\u00a0');
  }
});
</script>
</body>
</html>
