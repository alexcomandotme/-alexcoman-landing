<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>alexcoman.me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: transparent; }
  
  #terminal {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    font-family: 'JetBrains Mono', monospace;
    padding: 1rem 1rem 0;
  }

  .term-header {
    font-size: 10px;
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 0.75rem;
    flex-shrink: 0;
  }

  #output {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    font-size: 11px;
    line-height: 1.6;
    font-weight: 700;
  }
  #output .line { display: block; white-space: pre-wrap; word-break: break-word; }
  #output .dim   { color: rgba(255,255,255,0.3); }
  #output .bright{ color: #fff; }
  #output .ok    { color: #1D9E75; }
  #output .err   { color: #E24B4A; }
  #output .ai    { color: rgba(255,255,255,0.6); }
  #output .link  { color: #5DCAA5; }

  .term-input-row {
    display: flex;
    align-items: center;
    gap: 6px;
    border-top: 0.5px solid rgba(255,255,255,0.12);
    padding: 0.75rem 0;
    flex-shrink: 0;
  }
  .term-prompt {
    font-size: 10px;
    color: rgba(255,255,255,0.3);
    white-space: nowrap;
    font-weight: 700;
  }
  #term-input {
    background: transparent;
    border: none;
    outline: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    flex: 1;
    caret-color: #fff;
    -webkit-appearance: none;
    border-radius: 0;
  }
  #term-input::placeholder { color: rgba(255,255,255,0.4); }
</style>
</head>
<body>
<div id="terminal">
  <div class="term-header">alexcoman.me</div>
  <div id="output">
    <span class="line ai">operations, systems. you're at the surface.</span>
    <span class="line dim">there's more underneath.</span>
    <span class="line">&nbsp;</span>
    <span class="line ai">&gt; the background / the approach / work with alex</span>
    <span class="line">&nbsp;</span>
  </div>
  <div class="term-input-row">
    <span class="term-prompt">alex@coman ~ %</span>
    <input id="term-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="type a command..." />
  </div>
</div>

<script>
const API_URL = 'https://alexcoman-landing.vercel.app/api/ask';
const input   = document.getElementById('term-input');
const output  = document.getElementById('output');
const terminal = document.getElementById('terminal');

// ── iOS keyboard: shrink terminal to visual viewport ──
if (window.visualViewport) {
  const vv = window.visualViewport;
  function onVVResize() {
    terminal.style.height = vv.height + 'px';
    terminal.style.top    = vv.offsetTop + 'px';
    output.scrollTop = output.scrollHeight;
  }
  vv.addEventListener('resize', onVVResize);
  vv.addEventListener('scroll', onVVResize);
}

// keep input focused — but only when tapping inside terminal, not on links
terminal.addEventListener('click', (e) => {
  if (e.target.tagName !== 'A') input.focus();
});

const history = [];

function addLine(text, cls) {
  const span = document.createElement('span');
  span.className = 'line' + (cls ? ' ' + cls : '');
  span.textContent = text;
  output.appendChild(span);
  output.scrollTop = output.scrollHeight;
}

function renderResponse(text) {
  const lines = text.split('\n');
  lines.forEach(raw => {
    const l = raw.trimEnd();
    if (!l) { addLine('\u00a0'); return; }

    // email
    if (/^[\w.+-]+@[\w-]+\.\w+$/.test(l.trim())) {
      const a = document.createElement('a');
      a.href = 'mailto:' + l.trim();
      a.textContent = '> ' + l.trim();
      a.className = 'line link';
      output.appendChild(a);
      output.scrollTop = output.scrollHeight;
      return;
    }

    // plain text
    addLine('> ' + l, 'ai');
  });
  addLine('\u00a0');
}

function showThinking() {
  const span = document.createElement('span');
  span.className = 'line dim';
  span.textContent = '>';
  output.appendChild(span);
  output.scrollTop = output.scrollHeight;
  let d = 0;
  const t = setInterval(() => { d = (d+1)%4; span.textContent = '>'+'.'.repeat(d); }, 300);
  return { el: span, stop: () => clearInterval(t) };
}

const cmdHistory = [];
let cmdIdx = -1;

input.addEventListener('keydown', async (e) => {
  if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (!cmdHistory.length) return;
    if (cmdIdx === -1) cmdIdx = cmdHistory.length;
    input.value = cmdHistory[Math.max(0, --cmdIdx)];
    return;
  }
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (cmdIdx === -1) return;
    cmdIdx++;
    input.value = cmdIdx >= cmdHistory.length ? (cmdIdx = -1, '') : cmdHistory[cmdIdx];
    return;
  }
  if (e.key !== 'Enter') return;

  const val = input.value.trim();
  if (!val) return;

  cmdHistory.push(val);
  cmdIdx = -1;
  addLine('alex@coman ~ % ' + val, 'dim');
  input.value = '';

  // keep keyboard open
  setTimeout(() => input.focus(), 50);

  // local commands
  if (val.toLowerCase() === 'clear') { output.innerHTML = ''; return; }

  // AI
  const thinking = showThinking();
  history.push({ role: 'user', content: val });

  try {
    const res  = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: val, history: history.slice(-6) })
    });
    const data = await res.json();
    thinking.stop();
    thinking.el.remove();

    const text = data.text || '';
    history.push({ role: 'assistant', content: text });
    if (history.length > 12) history.splice(0, 2);

    renderResponse(text);
  } catch {
    thinking.stop();
    thinking.el.remove();
    addLine('> connection failed.', 'err');
    addLine('\u00a0');
  }
});
</script>
</body>
</html>
